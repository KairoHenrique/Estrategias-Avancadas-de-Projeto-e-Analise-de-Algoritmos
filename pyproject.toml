[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-algoritmos-np"
version = "0.1.0"
description = "Implementação de referência: Algoritmos Exatos, Aproximações e Verificadores Polinomiais (Tema 6)"
authors = [
    { name = "Kairo Henrique", email = "kairohenrique293@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
